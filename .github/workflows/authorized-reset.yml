name: Authorized single response reset
on:
  push:
    branches: [maintenance-reset-20261008]
    paths: [cloudflare/maintenance/reset-authorized-response.mjs, .github/workflows/authorized-reset.yml]
permissions:
  contents: read
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: baby-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reset only the explicitly authorized existing response
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/maintenance/reset-authorized-response.mjs
