
name: Cloudflare migration checks and deployment
on:
  push:
    branches: [main, cloudflare-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs cloudflare/tests/*.test.mjs
      - run: node --check cloudflare/worker.mjs && node --check cloudflare/deploy.mjs && node --check api.js && node --check admin.js && node --check app.js && node --check sonuclar.js
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    concurrency:
      group: baby-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Provision private storage and deploy the API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_EMAIL_FROM: ${{ vars.CLOUDFLARE_EMAIL_FROM }}
        run: node cloudflare/deploy.mjs
      - name: Publish the verified API connection to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          git worktree add /tmp/baby-pages origin/gh-pages
          cp -a publish/. /tmp/baby-pages/
          cd /tmp/baby-pages
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Cloudflare family API connection"
            git push origin HEAD:gh-pages
          fi
          gh api --method POST repos/"$GITHUB_REPOSITORY"/pages/builds
